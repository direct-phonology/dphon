name: release

on:
  release:
    types: [published]

permissions:
  id-token: write

jobs:
  publish:
    name: publish to pyPI
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      - name: Set up python
        run: uv python install
      - name: Build package
        run: uv build
      - name: Publish to PyPI
        run: uv publish
